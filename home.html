<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c2620">
<title>Money Home</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230c2620'/%3E%3Cpath d='M16 42 L28 28 L36 35 L48 20' stroke='%23e2b04a' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --page:#eef1ec; --card:#ffffff; --card2:#f6f8f5; --ink:#132019; --ink2:#3b4a42; --mut:#6b7a72; --line:#dfe5df;
  --hero:#0c2620; --hero2:#12372e; --hero-ink:#f3f1e8; --hero-mut:#a9bcb2; --gold:#e2b04a; --gold-soft:#f6e7c1;
  --up:#16804a; --dn:#c2412d;
  --ats:#4453c4; --exp:#c0701a; --led:#1f7fc9;
  --a1:#1f7fc9; --a2:#2aa37a; --a3:#e2b04a; --a4:#c0701a; --a5:#8a5cc8; --a6:#d1537c; --a7:#5b8c96; --a8:#9aa39e;
  --shadow:0 1px 2px rgb(15 30 25 / .05), 0 8px 24px -12px rgb(15 30 25 / .14);
  --display:'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif;
  --body:'Plus Jakarta Sans', -apple-system, 'Segoe UI', sans-serif;
  --mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark;
    --page:#0b110f; --card:#131b18; --card2:#18221e; --ink:#e7ede9; --ink2:#c1cdc6; --mut:#8d9c94; --line:#24302b;
    --hero:#0a1f1a; --hero2:#0f2d25; --up:#4cc38a; --dn:#ef7a66; --ats:#98a4f4; --exp:#f0a95c; --led:#72b4ee;
    --shadow:none; }
}
:root[data-theme="dark"]{ color-scheme:dark;
  --page:#0b110f; --card:#131b18; --card2:#18221e; --ink:#e7ede9; --ink2:#c1cdc6; --mut:#8d9c94; --line:#24302b;
  --hero:#0a1f1a; --hero2:#0f2d25; --up:#4cc38a; --dn:#ef7a66; --ats:#98a4f4; --exp:#f0a95c; --led:#72b4ee; --shadow:none; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
a{color:inherit}

/* ---------- hero: a night-green ledger page ---------- */
.hero{background:
    linear-gradient(180deg, transparent 0 calc(100% - 1px), rgb(255 255 255 / .05) 0) 0 0 / 100% 32px,
    radial-gradient(1200px 400px at 85% -10%, rgb(226 176 74 / .18), transparent 60%),
    linear-gradient(160deg, var(--hero2), var(--hero));
  color:var(--hero-ink);padding-top:env(safe-area-inset-top,0px)}
.hero-in{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:22px 34px}
.topline{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font:700 15px var(--display);letter-spacing:.01em}
.brand svg{width:28px;height:28px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;background:rgb(255 255 255 / .07);border:1px solid rgb(255 255 255 / .12);font-size:12.5px;color:var(--hero-ink)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--hero-mut)}
.chip.on i{background:#5fe0a0;box-shadow:0 0 0 3px rgb(95 224 160 / .2)}
.chip button{all:unset;cursor:pointer}
.hero-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:28px;align-items:center;margin-top:26px}
@media (max-width:820px){.hero-grid{grid-template-columns:1fr}}
.hello{font:500 15px var(--body);color:var(--hero-mut)}
.big{font:800 clamp(40px,7vw,68px)/1 var(--display);letter-spacing:-.03em;margin:8px 0 6px}
.big .num{font-family:var(--display);letter-spacing:-.03em}
.bigsub{color:var(--hero-mut);font-size:14px;max-width:52ch}
.bigsub b{color:var(--hero-ink);font-weight:600}
.day{display:inline-flex;gap:8px;align-items:center;margin-top:14px;padding:7px 12px;border-radius:10px;background:rgb(255 255 255 / .06);font-size:13.5px}
.day .up{color:#6fe0a8} .day .dn{color:#ff9a86}
.ringbox{display:flex;align-items:center;gap:20px;justify-self:end}
@media (max-width:820px){.ringbox{justify-self:start}}
.ring{width:168px;height:168px;flex:none}
.ring text{fill:var(--hero-ink)}
.ringfacts{display:flex;flex-direction:column;gap:12px}
.rf .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--hero-mut)}
.rf .v{font:600 18px var(--mono);color:var(--hero-ink)}
.ribbon{margin-top:28px}
.ribbar{display:flex;height:12px;border-radius:7px;overflow:hidden;background:rgb(255 255 255 / .08)}
.ribbar i{display:block;height:100%}
.ribbar i + i{border-left:2px solid var(--hero)}
.riblegend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12.5px;color:var(--hero-mut)}
.riblegend span{display:inline-flex;align-items:center;gap:6px}
.riblegend b{color:var(--hero-ink);font:500 12.5px var(--mono)}
.riblegend em{width:9px;height:9px;border-radius:3px;display:inline-block}

/* ---------- body ---------- */
main{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:0 60px}
.apps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:-18px}
@media (max-width:900px){.apps{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.apphead{display:flex;align-items:center;gap:12px}
.glyph{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,var(--card));color:var(--c);flex:none}
.glyph svg{width:22px;height:22px}
.apphead h2{margin:0;font:700 18px/1.2 var(--display)}
.apphead p{margin:1px 0 0;font-size:12.5px;color:var(--mut)}
.status{margin-left:auto;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--card2);color:var(--mut);white-space:nowrap}
.status.live{background:color-mix(in srgb,var(--up) 14%,var(--card));color:var(--up)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
.kv .l{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.kv .v{font:600 20px/1.25 var(--mono);font-variant-numeric:tabular-nums;margin-top:2px}
.kv .s{font-size:12px;color:var(--ink2)}
.up{color:var(--up)} .dn{color:var(--dn)}
.movers{display:flex;flex-wrap:wrap;gap:6px}
.mv{font-size:12px;padding:5px 9px;border-radius:8px;background:var(--card2);color:var(--ink2)}
.mv b{font-family:var(--mono);font-weight:600}
.empty{font-size:13px;color:var(--ink2);background:var(--card2);border-radius:12px;padding:12px 14px;line-height:1.45}
.open{margin-top:auto;display:inline-flex;align-items:center;gap:8px;align-self:flex-start;padding:9px 15px;border-radius:11px;background:var(--c);color:#fff;text-decoration:none;font-weight:600;font-size:13.5px;transition:transform .15s}
.open:hover{transform:translateY(-1px)}
.open:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

.row2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-top:16px}
@media (max-width:900px){.row2{grid-template-columns:1fr}}
.card h3{margin:0;font:700 17px var(--display)}
.card .cap{margin:-8px 0 0;font-size:12.5px;color:var(--mut)}
.flow{display:flex;height:34px;border-radius:10px;overflow:hidden;background:var(--card2)}
.flow i{display:flex;align-items:center;padding-inline:10px;color:#fff;font:600 12px var(--mono);white-space:nowrap;overflow:hidden;min-width:0}
.flowkey{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink2)}
.flowkey span{display:inline-flex;gap:6px;align-items:center}
.flowkey em{width:9px;height:9px;border-radius:3px}
.bars{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end;height:150px;padding-top:8px}
.bars .col{display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end}
.bars .stack{width:100%;max-width:44px;display:flex;flex-direction:column-reverse;border-radius:7px 7px 3px 3px;overflow:hidden}
.bars .stack i{display:block}
.bars .m{font-size:11px;color:var(--mut)}
.sip{display:flex;flex-direction:column;gap:6px}
.track{height:10px;border-radius:6px;background:var(--card2);overflow:hidden}
.track i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--led),color-mix(in srgb,var(--led) 60%,#7fd3b5))}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.todo li{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;padding:11px 0;border-top:1px solid var(--line)}
.todo li:first-child{border-top:0;padding-top:2px}
.when{grid-row:span 2;font:600 11.5px/1.2 var(--mono);color:var(--mut);background:var(--card2);border-radius:8px;padding:6px 8px;text-align:center;min-width:58px}
.when b{display:block;font-size:15px;color:var(--ink)}
.todo .a{font-weight:600;font-size:14px}
.todo .f{font-size:12.5px;color:var(--mut)}
.pr{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.foot{margin-top:24px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--mut)}
.btn{font:600 12.5px var(--body);border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:9px;padding:7px 12px;cursor:pointer}
.btn:hover{color:var(--ink)}

/* ---------- sign-in ---------- */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:linear-gradient(160deg,var(--hero2),var(--hero))}
.gate form{width:min(380px,100%);background:var(--card);border-radius:20px;padding:28px 26px;display:flex;flex-direction:column;gap:8px;box-shadow:0 30px 60px -20px rgb(0 0 0 / .5)}
.gate h1{font:800 28px/1.1 var(--display);margin:6px 0 4px;letter-spacing:-.02em}
.gate .sub{color:var(--mut);font-size:13.5px;margin:0 0 10px}
.gate label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:600;margin-top:6px}
.gate input{padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:var(--card2);color:var(--ink);font:15px var(--body)}
.gate input:focus{outline:none;border-color:var(--ats)}
.gate button{margin-top:12px;padding:12px;border:0;border-radius:11px;background:var(--hero);color:var(--gold);font:700 14.5px var(--body);cursor:pointer}
.gate .err{color:var(--dn);font-size:13px}
.skel{opacity:.55}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script src="/InvestmentPlan/cloud.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr = n => (n < 0 ? '−' : '') + '₹' + Math.round(Math.abs(n)).toLocaleString('en-IN');
const cr = n => { const a = Math.abs(n), s = n < 0 ? '−' : ''; return a >= 1e7 ? s + '₹' + (a / 1e7).toFixed(2) + ' Cr' : a >= 1e5 ? s + '₹' + (a / 1e5).toFixed(2) + ' L' : inr(n); };
const kfmt = n => { const a = Math.abs(n); return a >= 1e5 ? (n / 1e5).toFixed(1) + 'L' : a >= 1e3 ? Math.round(n / 1e3) + 'K' : Math.round(n) + ''; };
const pct = (n, d = 2) => (n >= 0 ? '+' : '−') + Math.abs(n).toFixed(d) + '%';
const ym = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
const ymLabel = (m, style = 'long') => new Date(+m.slice(0, 4), +m.slice(5, 7) - 1, 1).toLocaleDateString('en-IN', {month: style, year: style === 'long' ? 'numeric' : undefined});
const ago = ms => { const s = (Date.now() - ms) / 1000; return s < 90 ? 'just now' : s < 3600 ? Math.round(s / 60) + ' min ago' : s < 86400 ? Math.round(s / 3600) + ' h ago' : Math.round(s / 86400) + ' d ago'; };
const LINKS = {ats:'http://localhost:8765/', exp:'/expenseTracker/', led:'/InvestmentPlan/'};
const SESSION = 'money-home-session';
const ICON = {
  ats:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>',
  exp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18M7 15h4"/></svg>',
  led:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M9 10h6M9 14h6M9 18h3"/></svg>',
};
const ASSET = {EPF:'EPF', ESOPS_RSUS:'ESOPs & RSUs', STOCK:'Indian stocks & ETFs', IND_STOCK:'Indian stocks & ETFs', MF:'Mutual funds', US_STOCK:'US stocks',
  US_STOCK_WALLET:'US cash', NPS:'NPS', GOLD:'Gold', PHYSICAL_GOLD:'Physical gold', VEHICLE:'Vehicle', CRYPTO:'Crypto', FD:'FDs', PPF:'PPF', BOND:'Bonds'};
const PAL = ['--a1','--a2','--a3','--a4','--a5','--a6','--a7','--a8'];

const signedIn = () => { try{ return sessionStorage.getItem(SESSION) === 'yes'; }catch(e){ return false; } };
function ledger(){ try{ return JSON.parse(localStorage.getItem('ledger-draft-v2') || localStorage.getItem('ledger-state-v2') || 'null'); }catch(e){ return null; } }

/* ---------- sign-in: the Expense Tracker's (else the Ledger's own, else admin / admin) */
async function checkLogin(u, p){
  const et = await Cloud.checkExpenseTrackerLogin(u, p);
  if(et !== null) return et;
  const plan = ledger();
  if(plan && plan.auth && plan.auth.hash) return u.trim().toLowerCase() === String(plan.auth.user).toLowerCase() && await Cloud.sha256(u.trim().toLowerCase() + ':' + p) === plan.auth.hash;
  return u.trim().toLowerCase() === 'admin' && p === 'admin';
}
function showLogin(){
  $('app').innerHTML = `<div class="gate"><form id="lf">
    <div class="brand" style="color:var(--ink)">${logo()}Money Home</div>
    <h1>Welcome back</h1><p class="sub">Your trading, spending and investment plan in one place.</p>
    <label for="u">Username</label><input id="u" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required>
    <p class="err" id="e" hidden>That username or password is wrong.</p>
    <button>Sign in</button>
    <p class="sub" style="margin:8px 0 0;font-size:12px">The same sign-in as the Expense Tracker and the Ledger.</p></form></div>`;
  $('u').focus();
  $('lf').onsubmit = async e => { e.preventDefault();
    if(!(await checkLogin($('u').value, $('p').value))){ $('e').hidden = false; $('p').select(); return; }
    try{ sessionStorage.setItem(SESSION, 'yes'); }catch(_){}
    render(); };
}
const logo = () => `<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#0c2620"/><path d="M16 42 L28 28 L36 35 L48 20" stroke="#e2b04a" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

/* ---------- the Expense Tracker's own month totals (its plans.ts) */
function month(txns, m){
  const a = {spend:0, refunds:0, invested:0, redeemed:0, income:0};
  txns.forEach(t => { if(!t.date.startsWith(m) || t.excluded || t.kind === 'ignore') return; const out = t.direction === 'debit';
    if(t.kind === 'spend'){ if(out) a.spend += t.amount; else a.refunds += t.amount; }
    else if(t.kind === 'investment'){ if(out) a.invested += t.amount; else a.redeemed += t.amount; }
    else if(t.kind === 'cc_bill'){ if(out) a.spend += t.amount; }
    else if(t.kind === 'income' && !out) a.income += t.amount; });
  a.spend -= a.refunds;
  return a;
}
const shiftM = (m, k) => ym(new Date(+m.slice(0, 4), +m.slice(5, 7) - 1 + k, 1));

/* NSE by the clock (09:15-15:30 IST, Mon-Fri; holidays not known here) */
function market(){
  const ist = new Date(Date.now() + (330 + new Date().getTimezoneOffset()) * 60000);
  const d = ist.getDay(), mins = ist.getHours() * 60 + ist.getMinutes();
  if(d === 0 || d === 6) return {on:false, text:'NSE closed · weekend'};
  if(mins < 555) return {on:false, text:'NSE opens 09:15'};
  if(mins < 930) return {on:true, text:'NSE open · closes 15:30'};
  return {on:false, text:'NSE closed · opens 09:15'};
}

function ringSvg(p){
  const r = 70, c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, p));
  return `<svg class="ring" viewBox="0 0 168 168" role="img" aria-label="${(f * 100).toFixed(1)}% of the target">
    <circle cx="84" cy="84" r="${r}" fill="none" stroke="rgb(255 255 255 / .1)" stroke-width="12"/>
    <circle cx="84" cy="84" r="${r}" fill="none" stroke="var(--gold)" stroke-width="12" stroke-linecap="round"
      stroke-dasharray="${(c * f).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 84 84)"/>
    <text x="84" y="82" text-anchor="middle" style="font:800 30px var(--display)">${(f * 100).toFixed(1)}%</text>
    <text x="84" y="104" text-anchor="middle" style="font:500 11.5px var(--body);fill:var(--hero-mut)">of the target</text></svg>`;
}

/* draws straight away from this browser, then again when ATS answers (it can take a few seconds) */
let RUN = 0;
async function render(){
  const run = ++RUN;
  const et = await Cloud.expenseTracker(true);
  const linked = !!Cloud.atsLink();
  draw(et, linked ? 'checking' : null);
  if(!linked) return;
  const ats = await Cloud.atsHoldings().catch(e => ({err: e}));
  if(run === RUN) draw(et, ats);
}
function draw(et, ats){
  const plan = ledger();
  const mk = market();
  const atsOk = !!(ats && ats.ok), atsChecking = ats === 'checking';
  const hr = new Date().getHours(), hello = hr < 5 ? 'Up late' : hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening';
  const real = plan && !(plan.plan && plan.plan.starter);

  /* ----- net worth, corpus, target */
  const rows = real ? ((plan.importedSnapshot || {}).rows || []) : [];
  const ex = real && Array.isArray(plan.corpusExclude) ? plan.corpusExclude : ['VEHICLE'];
  const manual = real ? (plan.manualAssets || []) : [];
  const netWorth = rows.reduce((s, r) => s + (Number(r.current_value) || 0), 0) + manual.reduce((s, m) => s + (Number(m.current) || 0), 0);
  const corpus = rows.reduce((s, r) => s + (ex.indexOf(r.asset_type) < 0 ? Number(r.current_value) || 0 : 0), 0)
    + manual.reduce((s, m) => s + (ex.indexOf('MANUAL:' + m.id) < 0 ? Number(m.current) || 0 : 0), 0);
  const tHi = real ? Number(plan.targetHighCr) || 0 : 0, tLo = real ? Number(plan.targetLowCr) || 0 : 0;
  const retire = real ? Number(plan.retireAge) || 0 : 0;
  let yearsLeft = null;
  if(real && plan.plan && plan.plan.dob && retire){
    const [y, m, d] = plan.plan.dob.split('-').map(Number), age = (Date.now() - new Date(y, m - 1, d)) / (365.25 * 864e5);
    yearsLeft = Math.max(0, retire - age);
  }
  const sip = real ? [].concat(plan.indiaFunds || [], plan.usFunds || []).reduce((s, f) => s + (Number(f.monthly) || 0), 0) : 0;
  const T = atsOk ? ats.total || {} : {};

  /* allocation ribbon: every asset class, largest first */
  const alloc = {};
  rows.forEach(r => { const k = ASSET[r.asset_type] || String(r.asset_type).replace(/_/g, ' ').toLowerCase(); alloc[k] = (alloc[k] || 0) + (Number(r.current_value) || 0); });
  manual.forEach(m => { if(Number(m.current)) alloc[m.name || 'By hand'] = (alloc[m.name || 'By hand'] || 0) + Number(m.current); });
  const allocList = Object.entries(alloc).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
  const allocTop = allocList.slice(0, 7), rest = allocList.slice(7).reduce((s, [, v]) => s + v, 0);
  if(rest > 0) allocTop.push(['Other', rest]);

  const hero = `<header class="hero"><div class="hero-in">
    <div class="topline"><div class="brand">${logo()}Money Home</div>
      <div class="chips"><span class="chip ${mk.on ? 'on' : ''}"><i></i>${esc(mk.text)}</span>
        <span class="chip">${esc(new Date().toLocaleDateString('en-IN', {weekday:'long', day:'numeric', month:'long'}))}</span></div></div>
    <div class="hero-grid"><div>
      <div class="hello">${hello}. Here is where you stand.</div>
      ${netWorth ? `<div class="big"><span class="num">${cr(netWorth)}</span></div>
        <div class="bigsub">Net worth across everything INDmoney sees${manual.length ? ' and what you track by hand' : ''}. Your retirement corpus is <b>${cr(corpus)}</b>${ex.length ? ', leaving out ' + esc(ex.filter(x => x.indexOf('MANUAL:') < 0).map(x => (ASSET[x] || x).toLowerCase()).join(', ')) : ''}.</div>`
        : `<div class="big" style="font-size:40px">Hello</div><div class="bigsub">Open the Ledger once in this browser to see your net worth here.</div>`}
      ${atsOk ? `<div class="day">Holdings today <b class="num ${(T.day || 0) >= 0 ? 'up' : 'dn'}">${(T.day || 0) >= 0 ? '+' : ''}${inr(T.day || 0)}</b>${T.day_pct != null ? `<span class="${T.day_pct >= 0 ? 'up' : 'dn'}">${pct(T.day_pct)}</span>` : ''}</div>` : ''}
    </div>
    ${tHi ? `<div class="ringbox">${ringSvg(corpus / (tHi * 1e7))}<div class="ringfacts">
        <div class="rf"><div class="l">Target</div><div class="v">₹${esc(tLo)}–${esc(tHi)} Cr</div></div>
        <div class="rf"><div class="l">Retire at</div><div class="v">${esc(retire)}${yearsLeft != null ? ` <span style="font-size:13px;color:var(--hero-mut)">· ${yearsLeft.toFixed(1)} yrs</span>` : ''}</div></div>
        <div class="rf"><div class="l">Monthly SIP</div><div class="v">${inr(sip)}</div></div></div></div>` : ''}
    </div>
    ${allocTop.length ? `<div class="ribbon"><div class="ribbar" role="img" aria-label="Where the money is">${allocTop.map(([k, v], i) => `<i style="width:${(v / netWorth * 100).toFixed(2)}%;background:var(${PAL[i % PAL.length]})" title="${esc(k)} ${cr(v)}"></i>`).join('')}</div>
      <div class="riblegend">${allocTop.map(([k, v], i) => `<span><em style="background:var(${PAL[i % PAL.length]})"></em>${esc(k)} <b>${cr(v)}</b></span>`).join('')}</div></div>` : ''}
  </div></header>`;

  /* ----- ATS card */
  let atsBody;
  if(atsOk){
    const movers = (ats.items || []).filter(r => r.pct != null && r.value > 0).sort((a, b) => b.pct - a.pct);
    const lbl = r => String(r.symbol || r.name || '').replace(/\.NS$|\.BO$|-USD$/, '').slice(0, 14) || r.name;
    atsBody = `<div class="kv">
      <div><div class="l">Holdings now</div><div class="v">${cr(T.value || 0)}</div><div class="s">invested ${cr(T.invested || 0)}</div></div>
      <div><div class="l">Total gain</div><div class="v ${(T.gain || 0) >= 0 ? 'up' : 'dn'}">${(T.gain || 0) >= 0 ? '+' : ''}${cr(T.gain || 0)}</div><div class="s">${T.gain_pct != null ? pct(T.gain_pct) : ''}</div></div></div>
      ${movers.length ? `<div class="movers">${movers.slice(0, 2).map(r => `<span class="mv">▲ ${esc(lbl(r))} <b class="up">${pct(r.pct)}</b></span>`).join('')}${movers.slice(-2).reverse().filter(r => r.pct < 0).map(r => `<span class="mv">▼ ${esc(lbl(r))} <b class="dn">${pct(r.pct)}</b></span>`).join('')}</div>` : ''}
      <div class="s" style="font-size:12px;color:var(--mut)">Brokers synced ${ats.updated_at ? esc(new Date(ats.updated_at).toLocaleString('en-IN', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit', hour12:false})) : '—'} · ${esc(ats.source || '')}</div>`;
  } else if(atsChecking){
    atsBody = `<div class="empty">Asking ATS on this Mac for today’s numbers…</div>`;
  } else {
    atsBody = `<div class="empty">${!Cloud.atsLink() ? 'Link ATS once from the Ledger (Import portfolio → Link ATS on this Mac) and your holdings show here, live.'
      : 'ATS isn’t running on this device. It lives on your Mac — open it there to see today’s numbers.'}${real && plan.atsReadAt ? ` The Ledger last read it ${esc(ago(new Date(plan.atsReadAt).getTime()))}.` : ''}</div>`;
  }

  /* ----- Expense Tracker card + the month */
  const txns = et && et.txns || [];
  let expBody, monthCard = '', lastM = null, A = null;
  if(txns.length){
    const lastDate = txns.reduce((m, t) => t.date > m ? t.date : m, '');
    lastM = lastDate.slice(0, 7); A = month(txns, lastM);
    const B = month(txns, shiftM(lastM, -1));
    const d = B.spend ? (A.spend / B.spend - 1) * 100 : null;
    const left = A.income - A.spend - A.invested;
    expBody = `<div class="kv">
      <div><div class="l">Spent · ${esc(ymLabel(lastM, 'short'))}</div><div class="v">${inr(A.spend)}</div><div class="s">${d == null ? '&nbsp;' : `<span class="${d > 0 ? 'dn' : 'up'}">${pct(d, 0)}</span> vs ${esc(ymLabel(shiftM(lastM, -1), 'short'))}`}</div></div>
      <div><div class="l">Left over</div><div class="v ${left >= 0 ? 'up' : 'dn'}">${inr(left)}</div><div class="s">after spending and investing</div></div></div>
      <div class="s" style="font-size:12px;color:var(--mut)">Statements up to ${esc(new Date(lastDate).toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'}))}</div>`;
    const tot = Math.max(A.income, A.spend + A.invested + Math.max(0, left)) || 1;
    const seg = (v, c, t) => v > 0 ? `<i style="width:${(v / tot * 100).toFixed(2)}%;background:${c}" title="${t} ${inr(v)}">${v / tot > .14 ? kfmt(v) : ''}</i>` : '';
    const months6 = [...Array(6)].map((_, i) => shiftM(lastM, i - 5));
    const hist = months6.map(m => ({m, ...month(txns, m)}));
    const max = Math.max(1, ...hist.map(h => h.spend + h.invested));
    const sipBar = sip ? Math.min(100, A.invested / sip * 100) : null;
    monthCard = `<section class="card"><h3>${esc(ymLabel(lastM))}</h3><p class="cap">Where the month’s money went, from your bank statements</p>
      <div class="flow" role="img" aria-label="Income split">${seg(A.spend, 'var(--exp)', 'Spent')}${seg(A.invested, 'var(--led)', 'Invested')}${seg(Math.max(0, left), 'var(--a2)', 'Left over')}</div>
      <div class="flowkey"><span><em style="background:var(--exp)"></em>Spent <b class="num">${inr(A.spend)}</b></span>
        <span><em style="background:var(--led)"></em>Invested <b class="num">${inr(A.invested)}</b></span>
        <span><em style="background:var(--a2)"></em>Left over <b class="num">${inr(Math.max(0, left))}</b></span>
        <span style="color:var(--mut)">of income <b class="num">${inr(A.income)}</b></span></div>
      ${sipBar != null ? `<div class="sip"><div style="display:flex;justify-content:space-between;font-size:12.5px"><span>Invested vs the plan’s SIP</span><b class="num">${inr(A.invested)} / ${inr(sip)}</b></div><div class="track"><i style="width:${sipBar.toFixed(1)}%"></i></div></div>` : ''}
      <div><div style="font-size:12.5px;color:var(--mut);margin-bottom:2px">Last six months · spent and invested</div>
        <div class="bars">${hist.map(h => `<div class="col" title="${esc(ymLabel(h.m))}: spent ${inr(h.spend)}, invested ${inr(h.invested)}">
          <div class="stack" style="height:${Math.max(3, (h.spend + h.invested) / max * 118).toFixed(0)}px"><i style="flex:${Math.max(0, h.spend)};background:var(--exp)"></i><i style="flex:${h.invested};background:var(--led)"></i></div>
          <span class="m">${esc(ymLabel(h.m, 'short'))}</span></div>`).join('')}</div></div></section>`;
  } else {
    expBody = `<div class="empty">No statements in this browser yet. Import them in the Expense Tracker and this fills in by itself.</div>`;
  }

  /* ----- Ledger card + what is next on the plan */
  let ledBody, nextCard = '';
  if(real){
    const snaps = (plan.snapshots || []).slice().sort((a, b) => a.date < b.date ? -1 : 1);
    const last = snaps[snaps.length - 1], first = snaps[0];
    ledBody = `<div class="kv">
      <div><div class="l">Corpus</div><div class="v">${cr(corpus)}</div><div class="s">${tHi ? (corpus / (tHi * 1e7) * 100).toFixed(1) + '% of ₹' + esc(tHi) + ' Cr' : ''}</div></div>
      <div><div class="l">Since the start</div><div class="v ${last && first && last.value >= first.value ? 'up' : ''}">${last && first ? (last.value >= first.value ? '+' : '') + cr(last.value - first.value) : '—'}</div><div class="s">${first ? 'from ' + esc(new Date(first.date).toLocaleDateString('en-IN', {month:'short', year:'numeric'})) : ''}</div></div></div>
      <div class="s" style="font-size:12px;color:var(--mut)">${plan.atsReadAt ? 'Holdings read from ATS ' + esc(ago(new Date(plan.atsReadAt).getTime())) : 'Holdings as last imported'}</div>`;
    const PRC = {critical:'var(--dn)', warning:'var(--exp)', good:'var(--up)', gold:'var(--gold)'};
    const todo = (plan.calendar || []).filter(c => !c.done).sort((a, b) => (a.year - b.year) || (a.age - b.age)).slice(0, 4);
    nextCard = `<section class="card"><h3>Next on your plan</h3><p class="cap">The action calendar’s open items, soonest first</p>
      ${todo.length ? `<ul class="todo">${todo.map(c => `<li><span class="when"><b>${esc(c.year)}</b>age ${esc(c.age)}</span>
          <span class="a"><span class="pr" style="background:${PRC[c.pr] || 'var(--mut)'}"></span>${esc(c.action)}</span><span class="f">${esc(c.fund || '')}${c.why ? (c.fund ? ' — ' : '') + esc(c.why) : ''}</span></li>`).join('')}</ul>`
        : '<div class="empty">Nothing open on the action calendar.</div>'}</section>`;
  } else {
    ledBody = `<div class="empty">No plan in this browser yet. Open the Ledger and restore or sync your plan.</div>`;
  }

  const card = (k, name, sub, status, body, cta) => `<section class="card" style="--c:var(--${k})">
    <div class="apphead"><span class="glyph">${ICON[k]}</span><div><h2>${name}</h2><p>${sub}</p></div>${status}</div>${body}
    <a class="open" href="${LINKS[k]}" ${k === 'ats' ? 'target="_blank" rel="noopener"' : ''}>${cta} <span aria-hidden="true">→</span></a></section>`;

  $('app').innerHTML = hero + `<main>
    <div class="apps">
      ${card('ats', 'ATS', 'Trading dashboard · your Mac', atsOk ? '<span class="status live">live</span>' : atsChecking ? '<span class="status">checking</span>' : '<span class="status">offline</span>', atsBody, 'Open ATS')}
      ${card('exp', 'Expense Tracker', 'Spending from your statements', '', expBody, 'Open Expense Tracker')}
      ${card('led', '16-Year Ledger', 'Investment plan', real && plan.plan && plan.plan.dob ? '' : '', ledBody, 'Open the Ledger')}
    </div>
    ${monthCard || nextCard ? `<div class="row2">${monthCard || '<div></div>'}${nextCard}</div>` : ''}
    <div class="foot"><span>Read in this browser from the Expense Tracker and the Ledger${atsOk ? ', and live from ATS on this Mac' : ''}. Nothing is sent anywhere.</span>
      <span style="display:flex;gap:8px"><button class="btn" id="re">Refresh</button><button class="btn" id="out">Sign out</button></span></div>
  </main>`;
  $('re').onclick = render;
  $('out').onclick = () => { try{ sessionStorage.removeItem(SESSION); }catch(_){} showLogin(); };
}

try{ const t = localStorage.getItem('ledger-theme'); if(t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; }catch(e){}
if(signedIn()) render(); else showLogin();
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && signedIn() && !$('lf')) render(); });
</script>
</body>
</html>
